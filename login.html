<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in | Tech SG Studio (SMC-Pvt.) Ltd.</title><link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><link rel="stylesheet" href="fbr.css"><link rel="stylesheet" href="techsg-theme.css"><link rel="stylesheet" href="layout-fix.css"><link rel="stylesheet" href="app.css">
<script src="qr.js"></script><script src="core.js"></script></head>
<body data-page="login"><div id="root"></div>
<script src="fbr.js"></script><script src="advanced.js"></script>
<script>
SG.ready(function(){
 if(SG.session()){location.replace("index.html");return}
 document.getElementById("root").innerHTML='<div class="login-wrap"><div class="login-side"><img src="assets/logo.png" alt="Tech SG Studio"><h1>Tech SG Studio<br>(SMC-Pvt.) Ltd.</h1><p>Invoicing &amp; billing system</p><ul><li>Auto-generated Client IDs and Invoice numbers</li><li>QR code and shareable client link on every invoice</li><li>FBR digital invoicing ready</li><li>Admin and staff access</li></ul></div><div class="login-form"><form class="login-card" id="f"><h2>Welcome back</h2><p style="color:#667085;margin:0 0 18px">Sign in to your account</p><label>Username</label><input class="input" id="u" autocomplete="username" required><label>Password</label><input class="input" id="p" type="password" autocomplete="current-password" required><div class="login-err" id="e"></div><button class="btn primary">Sign in</button><div class="login-hint">First time? Sign in with <b>admin</b> / <b>Admin@123</b>, then change the password under Staff &amp; Users.</div></form></div></div>';
 document.getElementById("f").onsubmit=function(e){e.preventDefault();var u=SG.login(document.getElementById("u").value,document.getElementById("p").value);
  if(!u){document.getElementById("e").textContent="Wrong username or password.";return}
  var n=new URLSearchParams(location.search).get("next");location.href=(n&&/^[\w\-]+\.html/.test(n))?n:"index.html"}});</script></body></html>
