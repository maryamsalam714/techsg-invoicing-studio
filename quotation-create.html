<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create quotation | Tech SG Studio (SMC-Pvt.) Ltd.</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><link rel="stylesheet" href="fbr.css">
<script src="fbr.js" defer></script>
<link rel="stylesheet" href="techsg-theme.css">
<link rel="stylesheet" href="layout-fix.css">
<link rel="stylesheet" href="app.css">
<script src="qr.js"></script>
<script src="core.js"></script>
<script src="advanced.js" defer></script>
</head><body data-page="quotation-create"><main class="page" style="max-width:1000px;margin:auto"><div class="page-head"><div><div class="eyebrow">SALES</div><h1>Create quotation</h1><p>Prepare a clear quote for a client before converting it to an invoice.</p></div><a class="btn" href="quotations.html">Back to quotations</a></div><section class="form-card" style="padding:28px"><form id="quotation-form"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px"><label>Quotation number<input name="quotation_number" required placeholder="QT-2026-001"></label><label>Client name<input name="client_name" required placeholder="Client or company"></label><label>Issue date<input name="issue_date" type="date" required></label><label>Valid until<input name="valid_until" type="date" required></label><label>Currency<select name="currency"><option>PKR</option><option>USD</option><option>GBP</option><option>EUR</option></select></label><label>Estimated amount<input name="amount" type="number" min="0" step="0.01" required placeholder="0.00"></label></div><label style="display:block;margin-top:18px">Description / scope<textarea name="description" rows="4" placeholder="Describe products, services and terms"></textarea></label><div style="display:flex;gap:12px;justify-content:flex-end;margin-top:22px"><a class="btn" href="quotations.html">Cancel</a><button class="btn-primary" type="submit">Save quotation draft</button></div></form><p style="font-size:12px;color:#7a8498;margin-top:18px">Demo note: this standalone frontend saves a draft in this browser only. A production database/API is required for shared records and PDF/email delivery.</p></section></main><script src="enhancements.js"></script></body></html>
