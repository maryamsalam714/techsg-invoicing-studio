<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipt | Tech SG Studio (SMC-Pvt.) Ltd.</title><link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><link rel="stylesheet" href="fbr.css"><link rel="stylesheet" href="techsg-theme.css"><link rel="stylesheet" href="layout-fix.css"><link rel="stylesheet" href="app.css">
<script src="qr.js"></script><script src="core.js"></script></head>
<body data-page="invoice-view"><div id="root"></div>
<script src="fbr.js"></script><script src="advanced.js"></script>
<script>
SG.ready(async function(){
 var id=new URLSearchParams(location.search).get("id"),$=function(i){return document.getElementById(i)};

 // Find this payment (the server sends the list of payments)
 var pj=await SG.api("payments.php"),p=(pj.ok?pj.payments:[]).filter(function(x){return x.id===id})[0];
 var v=SG.shell({eyebrow:"RECEIPT",title:p?p.id:"Receipt not found",sub:p?"Payment receipt for "+p.invoice:"This receipt does not exist.",actions:'<a class="btn" href="invoices.html">Back</a>'});
 if(!p){v.innerHTML='<div class="card empty">Receipt not found.</div>';return}

 var inv=SG.invoice(p.invoice)||{},cl=SG.client(inv.clientId)||{},co=SG.company();
 var total=inv.id?Math.round(SG.totals(inv).total*100)/100:0,paid=+inv.paid||0,balance=Math.max(0,Math.round((total-paid)*100)/100);
 var row=function(a,b){return'<tr><td style="padding:9px 0;color:#667085;width:42%">'+a+'</td><td style="padding:9px 0;font-weight:600">'+((b===undefined||b===null||b==="")?"—":SG.esc(b))+"</td></tr>"};

 v.innerHTML='<div class="toolbar"><button class="btn primary" id="pr">Print / Save PDF</button><a class="btn light" href="invoice-view.html?id='+encodeURIComponent(p.invoice)+'">Back to invoice</a></div>'+
 '<article style="max-width:720px;margin:0 auto;background:#fff;border:1px solid #e3e8f2;border-radius:14px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact">'+
 '<header style="background:linear-gradient(90deg,#0b2447,#19376d);color:#fff;padding:22px 28px;display:flex;align-items:center;gap:16px"><img src="assets/logo.png" alt="" style="height:54px;background:#fff;border-radius:10px;padding:4px"><div><div style="font-size:20px;font-weight:800">'+SG.esc(co.name)+'</div><div style="opacity:.85;font-size:13px">'+SG.esc(co.tagline)+"</div></div></header>"+
 '<div style="height:4px;background:#f5a623"></div>'+
 '<section style="padding:26px 28px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:flex-start"><div><h1 style="margin:0;font-size:26px;letter-spacing:.5px">PAYMENT RECEIPT</h1><div style="color:#667085;margin-top:4px">'+SG.esc(co.legal||co.name)+'</div></div><div style="text-align:right"><div style="color:#667085;font-size:13px">Receipt No.</div><div style="font-size:20px;font-weight:800">'+SG.esc(p.id)+"</div></div></div>"+
 '<div style="margin:22px 0;padding:18px 20px;background:#f3f6fc;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span style="color:#667085">Amount received</span><span style="font-size:28px;font-weight:800;color:#0b2447">'+SG.fmt(p.amount)+"</span></div>"+
 '<table style="width:100%;border-collapse:collapse">'+row("Received from",cl.name||p.customer)+row("Client ID",cl.id)+row("For invoice",p.invoice)+row("Payment date",p.date)+row("Payment method",p.method)+row("Reference / transaction ID",p.reference)+row("Notes",p.notes)+"</table>"+
 '<table style="width:100%;border-collapse:collapse;margin-top:18px;border-top:1px solid #e3e8f2">'+row("Invoice total",SG.fmt(total))+row("Paid to date",SG.fmt(paid))+row("Balance due",SG.fmt(balance))+"</table>"+
 (p.status!=="Paid"?'<div style="margin-top:18px;color:#b42318;font-weight:700">This payment was '+SG.esc(p.status.toLowerCase())+". This receipt is no longer valid.</div>":"")+
 '<p style="margin:26px 0 0;color:#667085;font-size:13px">Thank you for your payment. This is a computer-generated receipt. '+SG.esc(co.email)+(co.phone?" | "+SG.esc(co.phone):"")+"</p></section></article>";

 $("pr").onclick=function(){window.print()}
});</script></body></html>
