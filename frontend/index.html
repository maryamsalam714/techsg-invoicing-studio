<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard | Tech SG Studio (SMC-Pvt.) Ltd.</title><link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="professional.css"><link rel="stylesheet" href="fbr.css"><link rel="stylesheet" href="techsg-theme.css"><link rel="stylesheet" href="layout-fix.css"><link rel="stylesheet" href="app.css">
<script src="qr.js"></script><script src="core.js"></script></head>
<body data-page="index"><div id="root"></div>
<script src="fbr.js"></script><script src="advanced.js"></script>
<script>
SG.ready(function(){
 var v=SG.shell({eyebrow:"OVERVIEW",title:"Dashboard",sub:"Live summary of billing, clients and collections.",actions:'<a class="btn primary" href="invoice-create.html">+ New invoice</a><a class="btn" href="clients.html">Clients</a>'});
 var inv=SG.invoices(),cl=SG.clients(),T=function(i){return SG.totals(i).total},S=SG.status;
 var live=inv.filter(function(i){return i.status!=="Draft"&&i.status!=="Cancelled"}),sum=function(a){return a.reduce(function(s,i){return s+T(i)},0)};
 var paid=live.filter(function(i){return S(i)==="Paid"}),pend=live.filter(function(i){return S(i)==="Pending"}),over=live.filter(function(i){return S(i)==="Overdue"});
 var st=function(ic,c,l,val,cap){return'<div class="stat"><div class="stat-icon '+c+'"><i class="fa-solid '+ic+'"></i></div><div><span>'+l+"</span><h2>"+val+"</h2><small>"+cap+"</small></div></div>"};
 var mon=[],now=new Date();for(var k=5;k>=0;k--){var d=new Date(now.getFullYear(),now.getMonth()-k,1);mon.push({key:d.toISOString().slice(0,7),lab:d.toLocaleString("en",{month:"short"}),v:0})}
 live.forEach(function(i){mon.forEach(function(m){if(i.issue.slice(0,7)===m.key)m.v+=T(i)})});var mx=Math.max.apply(null,mon.map(function(m){return m.v}).concat([1]));
 var recent=inv.slice().sort(function(a,b){return a.issue<b.issue?1:-1}).slice(0,6).map(function(i){var c=SG.client(i.clientId)||{};return'<tr><td><b>'+SG.esc(i.id)+"</b></td><td>"+SG.esc(c.name||"—")+"</td><td>"+i.issue+"</td><td>"+SG.fmt(T(i))+"</td><td>"+SG.badge(S(i))+'</td><td><a class="btn sm light" href="invoice-view.html?id='+encodeURIComponent(i.id)+'">View</a></td></tr>'}).join("")||'<tr><td colspan="6" class="empty">No invoices yet.</td></tr>';
 var pct=live.length?Math.round(paid.length/live.length*100):0;
 v.innerHTML='<div class="stats">'+st("fa-file-invoice","blue","Total billed",SG.fmt(sum(live)),live.length+" invoices")+st("fa-circle-check","green","Collected",SG.fmt(sum(paid)),paid.length+" paid")+st("fa-clock","orange","Pending",SG.fmt(sum(pend)),pend.length+" awaiting payment")+st("fa-triangle-exclamation","red","Overdue",SG.fmt(sum(over)),over.length+" need follow-up")+"</div>"+
 '<div class="dashboard-grid"><div class="card"><div class="card-head"><div><h3>Billing overview</h3><p>Invoiced amount per month (last 6 months)</p></div></div><div class="chart-area"><div class="chart-y"><span>'+SG.num(mx)+"</span><span>"+SG.num(mx/2)+"</span><span>0</span></div><div class=\"chart-bars\">"+mon.map(function(m){return'<div class="bar-column" title="'+SG.fmt(m.v)+'"><div class="bar" style="height:'+Math.max(m.v/mx*88,m.v?4:1)+'%"></div><span>'+m.lab+"</span></div>"}).join("")+'</div></div></div>'+
 '<div class="card"><div class="card-head"><div><h3>Quick actions</h3><p>Common tasks</p></div></div><div class="quick-actions"><a class="quick-action" href="invoice-create.html"><span class="quick-action-icon blue"><i class="fa-solid fa-file-circle-plus"></i></span><span><b>Create invoice</b><small>Auto invoice number</small></span></a><a class="quick-action" href="clients.html"><span class="quick-action-icon green"><i class="fa-solid fa-user-plus"></i></span><span><b>Add client</b><small>Auto client ID</small></span></a><a class="quick-action" href="invoices.html"><span class="quick-action-icon orange"><i class="fa-solid fa-share-nodes"></i></span><span><b>Send to client</b><small>Link, email, WhatsApp</small></span></a><a class="quick-action" data-role="admin" href="users.html"><span class="quick-action-icon purple"><i class="fa-solid fa-user-group"></i></span><span><b>Staff accounts</b><small>Admin only</small></span></a></div></div></div>'+
 '<div class="dashboard-lower"><div class="card"><div class="card-head"><div><h3>Collection status</h3><p>'+cl.length+" clients · "+inv.length+' invoices</p></div></div><div class="status-overview"><div class="status-total">'+pct+'% paid</div><div class="status-list"><div class="status-row"><span class="status-label"><i class="status-dot paid"></i>Paid</span><b>'+paid.length+'</b></div><div class="status-row"><span class="status-label"><i class="status-dot pending"></i>Pending</span><b>'+pend.length+'</b></div><div class="status-row"><span class="status-label"><i class="status-dot overdue"></i>Overdue</span><b>'+over.length+'</b></div><div class="status-row"><span class="status-label"><i class="status-dot"></i>Draft</span><b>'+inv.filter(function(i){return i.status==="Draft"}).length+'</b></div></div><div class="progress"><div class="progress-bar" style="width:'+pct+'%"></div></div></div></div>'+
 '<div class="card"><div class="card-head"><div><h3>Recent invoices</h3><p>Latest billing activity</p></div><a class="btn sm light" href="invoices.html">View all</a></div><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Client</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>'+recent+"</tbody></table></div></div></div>"});</script></body></html>
